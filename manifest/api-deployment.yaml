# manifest/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eshop-api
  template:
    metadata:
      labels:
        app: eshop-api
    spec:
      containers:
        - name: eshop-api
          # Buraya API için oluşturacağın imaj gelecek
          image: git.local:3000/mehmet/eshoponweb-api:manual-mac
          ports:
            - containerPort: 80
          env:
            - name: ConnectionStrings__CatalogConnection
              value: "Server=sqlserver;Database=Microsoft.eShopOnWeb.CatalogDb;User Id=sa;Password=Password123!;"
---
apiVersion: v1
kind: Service
metadata:
  name: eshoppublicapi
  namespace: default
spec:
  selector:
    app: eshop-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
